name: InFlex Flutter Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Flutter Version Info
        run: flutter --version

      # This clears stale outputs and forces a re-fetch of dependencies
      - name: Deep Clean and Purge Cache
        run: |
          flutter clean
          rm -f pubspec.lock

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub upgrade intorrent

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # Single ABI only, for now - every test/device this whole project
      # has been built/verified against is arm64. Also avoids two
      # separate problems multi-ABI builds hit here: (1) compiling
      # libtorrent from scratch 3x (once per ABI) was eating almost
      # this runner's entire disk budget by itself, and (2) Gradle runs
      # each variant's resource-merge task in parallel by default, and
      # two variants can race to create the same output directory
      # (e.g. media_kit_libs_android_video's merged_res/.../values-it),
      # which Gradle reports as a hard failure even though nothing is
      # actually wrong. One ABI means neither problem has anything to
      # bump into. Revisit --split-per-abi (plus a disk-space-freeing
      # step first) once real arm32/x86_64 devices need testing.
      - name: Build APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk/
          VERSION=$(grep 'version:' ../../../../pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          mv app-release.apk InFlex-v${VERSION}-arm64.apk
          ls -lh *.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InFlex-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
