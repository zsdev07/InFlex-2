name: inflex
description: InFlex - Hindi Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # Video Player
  video_player: ^2.8.6
  chewie: ^1.7.0
  url_launcher: ^6.3.0

  # WebView (embed source fallback)
  webview_flutter: ^4.10.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # State
  provider: ^6.1.2

  # Local storage (watchlist only — kept lightweight)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Supabase — cache DB for magnet_link ↔ file_id mapping
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # hive_generator removed — no Hive type adapters needed
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
