name: inflex
description: InFlex - Hindi Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # ── P2P Torrent Engine (replaces Render/GitHub Actions loop) ──────────────
  # Wraps libtorrent 2.0 via Dart FFI. Built-in sequential download +
  # HTTP streaming server on localhost. No remote upload needed.
  libtorrent_flutter: ^1.8.2

  # ── Video Player (replaces video_player + chewie) ─────────────────────────
  # Native media engine. Handles HEVC/H.265, MKV, HDR out of the box.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.9   # Android native libs

  # URL launcher — kept for "Open in External Player" fallback
  url_launcher: ^6.3.0

  # WebView (embed source fallback)
  webview_flutter: ^4.10.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # State
  provider: ^6.1.2

  # Local storage (watchlist only — kept lightweight)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Supabase — Telegram cache fast path (kept)
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
