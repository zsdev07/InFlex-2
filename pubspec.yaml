name: inflex
description: InFlex - Hindi Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # ── P2P Torrent Engine (replaces Render/GitHub Actions loop) ──────────────
  # Our own plugin (github.com/zsdev07/InTorrent) - wraps libtorrent 2.1 via
  # Dart FFI. Not on pub.dev yet, hence the git dependency. Built-in
  # sequential download + HTTP streaming server on localhost, plus the
  # pause-prefetch API (startPrefetch/cancelPrefetch) used by TorrentEngine.
  #
  # NOTE: TorrentEngine now calls intorrent.availableBytes(),
  # streamReadCursor(), startPrefetch() and cancelPrefetch(), which only
  # exist in the updated InTorrent - push that repo BEFORE building this one.
  intorrent:
    git:
      url: https://github.com/zsdev07/InTorrent.git

  # ── Video Player (replaces video_player + chewie) ─────────────────────────
  # Native media engine. Handles HEVC/H.265, MKV, HDR out of the box.
  media_kit: ^1.1.11
  media_kit_video: 1.2.4
  media_kit_libs_android_video: ^1.0.9   # Android native libs

  # URL launcher — kept for "Open in External Player" fallback
  url_launcher: ^6.3.0

  # WebView (embed source fallback)
  webview_flutter: ^4.10.0

  # UI
  cached_network_image: ^3.3.1

  # State
  provider: ^6.1.2

  # Local storage (watchlist only — kept lightweight)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Supabase — Telegram cache fast path (kept)
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9

  # App/launcher icon generator. Run once after adding/changing
  # assets/logo.png:  dart run flutter_launcher_icons
  # (this does NOT touch the splash screen's own logo - that one is drawn
  # in code, see screens/splash_screen.dart - only the installed app icon.)
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Config read by `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  # Regenerates android/app/src/main/res/mipmap-*/ic_launcher.png at every
  # density from this one image - crop it square with the subject centred
  # for the best result (launchers apply their own mask/shape on top).
